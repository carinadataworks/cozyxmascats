<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cozy Xmas Cats</title>
<style>
html,body{margin:0;height:100%;background:#0d0a0a;overflow:hidden}
.s{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:max(100vw,177.78vh);height:max(56.25vw,100vh);background:url(bg.png) 0 0/100% 100%;image-rendering:pixelated;overflow:hidden}
@media (max-aspect-ratio:4/3){.s{width:min(100vw,177.78vh);height:min(56.25vw,100vh)}}
.s>*{position:absolute;pointer-events:none;image-rendering:pixelated}
#fire{left:38.896%;top:33.094%;width:21.983%;height:28.708%;opacity:.9;mix-blend-mode:screen;-webkit-mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent);mask-image:linear-gradient(90deg,transparent,#000 12%,#000 88%,transparent)}
.front{z-index:2}.ttail,.tbody,.ktail,.kbody,.khead{z-index:3}
.front{left:38.896%;top:43.062%;width:21.983%;height:18.740%;transform-origin:50% 100%;animation:none}
.ttail{left:48.362%;top:62.121%;width:4.666%;height:9.250%;transform-origin:47.1% 0.9%;animation:sway 7s ease-in-out infinite}
.tbody{left:36.205%;top:51.037%;width:16.779%;height:20.335%;transform-origin:50% 100%;animation:br 4.4s ease-in-out infinite}
.ktail{left:51.279%;top:82.616%;width:6.909%;height:8.692%;transform-origin:2.6% 58.7%;animation:flick 9s ease-in-out infinite}
.kbody{left:37.550%;top:73.525%;width:20.637%;height:17.783%;transform-origin:50% 100%;animation:br 5.2s ease-in-out infinite -2s}
.khead{left:37.550%;top:73.604%;width:7.851%;height:17.703%;transform-origin:85.7% 61.7%;animation:bob 11s ease-in-out infinite}
@keyframes br{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.018)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes flick{0%,80%,100%{transform:rotate(0)}84%{transform:rotate(-9deg)}88%{transform:rotate(3deg)}92%{transform:rotate(-5deg)}}
@keyframes bob{0%,70%,100%{transform:rotate(0)}74%{transform:rotate(-2.5deg)}78%{transform:rotate(0)}80%{transform:rotate(-1.5deg)}83%{transform:rotate(0)}}
#glow{inset:0;z-index:4;background:radial-gradient(ellipse 45% 55% at 50.6% 50%,rgba(255,150,60,.35),rgba(255,120,40,.12) 50%,transparent 75%);mix-blend-mode:soft-light}
.e{width:.3%;height:.53%;background:#ffb347;top:46%;z-index:1;animation:em 3.2s steps(14) infinite;opacity:0}
@keyframes em{0%{opacity:0;transform:translate(0,0)}15%{opacity:1}100%{opacity:0;transform:translate(1vmin,-14vmin)}}
.btn{position:fixed;left:50%;bottom:4vmin;transform:translateX(-50%);font:bold 14px monospace;color:#ffe3a8;background:#3a1c14;border:3px solid #ffb347;box-shadow:3px 3px 0 #000;padding:8px 14px;cursor:pointer;transition:opacity 1.5s;z-index:9}
@media (prefers-reduced-motion:reduce){.s *{animation:none!important}.e{display:none}}
</style></head><body><div class="s">
<canvas id="fire" width="96" height="72"></canvas>
<img class="sp front" src="front.png" alt="">
<img class="sp ttail" src="ttail.png" alt="">
<img class="sp tbody" src="tbody.png" alt="">
<img class="sp ktail" src="ktail.png" alt="">
<img class="sp kbody" src="kbody.png" alt="">
<img class="sp khead" src="khead.png" alt="">
<div id="glow"></div>
<i class="e" style="left:47%"></i><i class="e" style="left:50%;animation-delay:-1.1s"></i><i class="e" style="left:54%;animation-delay:-2.2s"></i>
</div>
<script>
(function(){const c=document.getElementById('fire'),x=c.getContext('2d'),w=96,h=72,P=[[0,0,0,0]];
const st=[[40,8,4],[90,16,6],[140,30,8],[180,50,10],[210,80,14],[235,115,20],[248,150,30],[255,185,50],[255,215,90],[255,240,160],[255,252,220]];
for(let i=1;i<37;i++){const f=i/36*(st.length-1),a=Math.floor(f),b=Math.min(a+1,st.length-1),t=f-a;P.push([0,1,2].map(k=>st[a][k]+(st[b][k]-st[a][k])*t).concat([Math.min(255,i*22)]))}
const F=new Uint8Array(w*h);for(let i=0;i<w;i++){const d=Math.abs(i-w/2)/(w/2);F[(h-1)*w+i]=d<.9?36:30}
const img=x.createImageData(w,h),g=document.getElementById('glow'),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=0;
function step(){for(let X=0;X<w;X++)for(let Y=1;Y<h;Y++){const s=Y*w+X,p=F[s];if(!p){F[s-w]=0;continue}const r=Math.random()*3.4|0,d=s-r+1;F[Math.max(0,d-w)]=Math.max(0,p-(r&1)*(Math.random()<.7?1:0))}
for(let i=0;i<w*h;i++){const q=P[F[i]];img.data.set(q,i*4)}x.putImageData(img,0,0)}
function loop(t){if(t-last>33){last=t;step();g.style.opacity=.75+Math.random()*.25}requestAnimationFrame(loop)}
for(let i=0;i<40;i++)step();if(!rm)requestAnimationFrame(loop);else step()})();
</script>
<button class="btn" id="b">&#9654; click for sound</button><script>
let A,M,on=0;const B=document.getElementById('b');
function noise(c,s){const n=c.sampleRate*s,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=s>1?l*3.5:w}return b}
function src(b){const s=A.createBufferSource();s.buffer=b;s.loop=true;s.start();return s}
function start(){A=new AudioContext();M=A.createGain();M.gain.value=.5;M.connect(A.destination);const t=A.currentTime;
// purr
const p=src(noise(A,4)),pf=A.createBiquadFilter();pf.type='lowpass';pf.frequency.value=180;const am=A.createGain();am.gain.value=0;const o=A.createOscillator();o.frequency.value=25;const og=A.createGain();og.gain.value=.5;o.connect(og).connect(am.gain);o.start();const br=A.createGain();br.gain.value=.25;const bo=A.createOscillator();bo.frequency.value=.4;const bg=A.createGain();bg.gain.value=.2;bo.connect(bg).connect(br.gain);bo.start();p.connect(pf).connect(am).connect(br).connect(M);
// hiss
const wb=noise(A,2),h=src(wb),hf=A.createBiquadFilter();hf.type='bandpass';hf.frequency.value=3000;const hg=A.createGain();hg.gain.value=.012;h.connect(hf).connect(hg).connect(M);
(function cr(){const s=A.createBufferSource();s.buffer=wb;const f=A.createBiquadFilter();f.type='highpass';f.frequency.value=1000+Math.random()*3000;const g=A.createGain(),n=A.currentTime;g.gain.setValueAtTime(.08*Math.random()+.02,n);g.gain.exponentialRampToValueAtTime(.001,n+.03+Math.random()*.05);s.connect(f).connect(g).connect(M);s.start(n,Math.random());s.stop(n+.1);setTimeout(cr,60+Math.random()*(Math.random()<.2?80:600))})();
// Silent Night
const N={D:587.3,E:659.3,F:698.5,G:784,A:880,B:987.8,c:1046.5,d:1174.7,e:1318.5,f:1396.9},q='G3A1G2E6G3A1G2E6d4d2B6c4c2G6A4A2c3B1A2G3A1G2E6A4A2c3B1A2G3A1G2E6d4d2f3d1B2c6e6c3G1E2G3F1D2c12'.match(/[A-Za-z]\d+/g);
function bell(f,t,d){[1,2,3.01].forEach((h,i)=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=f*h;g.gain.setValueAtTime(.05/(1+i*3),t);g.gain.exponentialRampToValueAtTime(.0001,t+d+1.2);o.connect(g).connect(M);o.start(t);o.stop(t+d+1.3)})}
(function song(t0){let t=t0;q.forEach(x=>{const d=+x.slice(1)*.33;bell(N[x[0]],t,d);t+=d});setTimeout(()=>song(t+4),(t-A.currentTime)*1000)})(t+1);on=1}
document.addEventListener('click',()=>{if(!A){start();B.style.opacity=0;setTimeout(()=>B.remove(),1600)}else{on=!on;M.gain.setTargetAtTime(on?.5:0,A.currentTime,.1)}});
</script></body></html>
