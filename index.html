<script>
(function(){const c=document.getElementById('fire'),x=c.getContext('2d'),w=96,h=72,P=[[0,0,0,0]];
const st=[[40,8,4],[90,16,6],[140,30,8],[180,50,10],[210,80,14],[235,115,20],[248,150,30],[255,185,50],[255,215,90],[255,240,160],[255,252,220]];
for(let i=1;i<37;i++){const f=i/36*(st.length-1),a=Math.floor(f),b=Math.min(a+1,st.length-1),t=f-a;P.push([0,1,2].map(k=>st[a][k]+(st[b][k]-st[a][k])*t).concat([Math.min(255,i*22)]))}
const F=new Uint8Array(w*h);for(let i=0;i<w;i++){const d=Math.abs(i-w/2)/(w/2);F[(h-1)*w+i]=d<.9?36:30}
const img=x.createImageData(w,h),g=document.getElementById('glow'),rm=matchMedia('(prefers-reduced-motion: reduce)').matches;let last=0;
let step=function(){for(let X=0;X<w;X++)for(let Y=1;Y<h;Y++){const s=Y*w+X,p=F[s];if(!p){F[s-w]=0;continue}const r=Math.random()*3.4|0,d=s-r+1;F[Math.max(0,d-w)]=Math.max(0,p-(Math.random()<.55?1:0)-(Math.random()<(1-Y/h)*.9?1:0)-(Math.random()<.04?3:0))}
for(let i=0;i<w*h;i++){const q=P[F[i]];img.data.set(q,i*4)}x.putImageData(img,0,0)}
function loop(t){if(t-last>33){last=t;step();g.style.opacity=.75+Math.random()*.25}requestAnimationFrame(loop)}
const sc=document.getElementById('snow'),sx=sc.getContext('2d'),fl=[...Array(28)].map(()=>[Math.random()*64,Math.random()*76,.15+Math.random()*.35]);
function snow(){sx.clearRect(0,0,64,76);sx.fillStyle='#e8f0ff';fl.forEach(f=>{f[1]+=f[2];f[0]+=Math.sin(f[1]/7)*.15;if(f[1]>76){f[1]=-1;f[0]=Math.random()*64}sx.fillRect(f[0]|0,f[1]|0,1,1)})}
const _st=step;step=function(){_st();snow()};
for(let i=0;i<40;i++)step();if(!rm)requestAnimationFrame(loop);else step()})();
</script>
<button class="btn" id="b">&#9654; click for sound</button><script>
let A,M,on=0;const B=document.getElementById('b');
function noise(c,s){const n=c.sampleRate*s,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=s>1?l*3.5:w}return b}
function src(b){const s=A.createBufferSource();s.buffer=b;s.loop=true;s.start();return s}
function start(){A=new AudioContext();M=A.createGain();M.gain.value=.5;M.connect(A.destination);const t=A.currentTime;
// purr
const p=src(noise(A,4)),pf=A.createBiquadFilter();pf.type='lowpass';pf.frequency.value=180;const am=A.createGain();am.gain.value=0;const o=A.createOscillator();o.frequency.value=25;const og=A.createGain();og.gain.value=.5;o.connect(og).connect(am.gain);o.start();const br=A.createGain();br.gain.value=.25;const bo=A.createOscillator();bo.frequency.value=.4;const bg=A.createGain();bg.gain.value=.2;bo.connect(bg).connect(br.gain);bo.start();p.connect(pf).connect(am).connect(br).connect(M);
// hiss
const wb=noise(A,2),h=src(wb),hf=A.createBiquadFilter();hf.type='bandpass';hf.frequency.value=3000;const hg=A.createGain();hg.gain.value=.012;h.connect(hf).connect(hg).connect(M);
(function cr(){const s=A.createBufferSource();s.buffer=wb;const f=A.createBiquadFilter();f.type='highpass';f.frequency.value=1000+Math.random()*3000;const g=A.createGain(),n=A.currentTime;g.gain.setValueAtTime(.08*Math.random()+.02,n);g.gain.exponentialRampToValueAtTime(.001,n+.03+Math.random()*.05);s.connect(f).connect(g).connect(M);s.start(n,Math.random());s.stop(n+.1);setTimeout(cr,60+Math.random()*(Math.random()<.2?80:600))})();
// Silent Night
const N={D:587.3,E:659.3,F:698.5,G:784,A:880,B:987.8,c:1046.5,d:1174.7,e:1318.5,f:1396.9},q='G3A1G2E6G3A1G2E6d4d2B6c4c2G6A4A2c3B1A2G3A1G2E6A4A2c3B1A2G3A1G2E6d4d2f3d1B2c6e6c3G1E2G3F1D2c12'.match(/[A-Za-z]\d+/g);
function bell(f,t,d){[1,2,3.01].forEach((h,i)=>{const o=A.createOscillator(),g=A.createGain();o.frequency.value=f*h;g.gain.setValueAtTime(.05/(1+i*3),t);g.gain.exponentialRampToValueAtTime(.0001,t+d+1.2);o.connect(g).connect(M);o.start(t);o.stop(t+d+1.3)})}
(function song(t0){let t=t0;q.forEach(x=>{const d=+x.slice(1)*.33;bell(N[x[0]],t,d);t+=d});setTimeout(()=>song(t+4),(t-A.currentTime)*1000)})(t+1);on=1}
document.addEventListener('click',()=>{if(!A){start();B.style.opacity=0;setTimeout(()=>B.remove(),1600)}else{on=!on;M.gain.setTargetAtTime(on?.5:0,A.currentTime,.1)}});
</script></body></html>
