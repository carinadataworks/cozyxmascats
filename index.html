let A,M,on=0;const B=document.getElementById('b');
function noise(c,s){const n=c.sampleRate*s,b=c.createBuffer(1,n,c.sampleRate),d=b.getChannelData(0);let l=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=s>1?l*3.5:w}return b}
function src(b){const s=A.createBufferSource();s.buffer=b;s.loop=true;s.start();return s}
function start(){A=new AudioContext();M=A.createGain();M.gain.value=.5;M.connect(A.destination);const t=A.currentTime;
// purr
const p=src(noise(A,4)),pf=A.createBiquadFilter();pf.type='lowpass';pf.frequency.value=180;const am=A.createGain();am.gain.value=0;const o=A.createOscillator();o.frequency.value=25;const og=A.createGain();og.gain.value=.5;o.connect(og).connect(am.gain);o.start();const br=A.createGain();br.gain.value=.25;const bo=A.createOscillator();bo.frequency.value=.4;const bg=A.createGain();bg.gain.value=.2;bo.connect(bg).connect(br.gain);bo.start();p.connect(pf).connect(am).connect(br).connect(M);
// hiss
const wb=noise(A,2),h=src(wb),hf=A.createBiquadFilter();hf.type='bandpass';hf.frequency.value=3000;const hg=A.createGain();hg.gain.value=.012;h.connect(hf).connect(hg).connect(M);
(function cr(){const s=A.createBufferSource();s.buffer=wb;const f=A.createBiquadFilter();f.type='highpass';f.frequency.value=1000+Math.random()*3000;const g=A.createGain(),n=A.currentTime;g.gain.setValueAtTime(.08*Math.random()+.02,n);g.gain.exponentialRampToValueAtTime(.001,n+.03+Math.random()*.05);s.connect(f).connect(g).connect(M);s.start(n,Math.random());s.stop(n+.1);setTimeout(cr,60+Math.random()*(Math.random()<.2?80:600))})();
on=1}
document.addEventListener('click',()=>{if(!A){start();B.style.opacity=0;setTimeout(()=>B.remove(),1600)}else{on=!on;M.gain.setTargetAtTime(on?.5:0,A.currentTime,.1)}});

const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fc=document.getElementById('fire'),fx=fc.getContext('2d'),FW=96,FH=72,P=new Uint8Array(FW*FH),img=fx.createImageData(FW,FH);
const pal=[];for(let i=0;i<37;i++){const t=i/36;pal.push([Math.min(255,t*3*255),Math.max(0,Math.min(255,(t*2-.35)*255)),Math.max(0,Math.min(255,(t*3-2.1)*255)),Math.min(255,t*4*255)])}
for(let x=0;x<FW;x++)P[(FH-1)*FW+x]=36;
function step(){for(let x=0;x<FW;x++)P[(FH-1)*FW+x]=Math.random()<.85?36:28;for(let x=0;x<FW;x++)for(let y=1;y<FH;y++){const s=y*FW+x,r=Math.round(Math.random()*3)&3,d=s-r+1;P[Math.max(0,d-FW)]=Math.max(0,P[s]-(r&1)-(y<FH*.45?1:0))}
for(let i=0;i<FW*FH;i++){const c=pal[P[i]];img.data[i*4]=c[0];img.data[i*4+1]=c[1];img.data[i*4+2]=c[2];img.data[i*4+3]=c[3]}fx.putImageData(img,0,0)}
const ec=document.getElementById('emb'),ex=ec.getContext('2d');let E=[];
function emb(){ex.clearRect(0,0,ec.width,ec.height);if(E.length<14&&Math.random()<.2)E.push({x:ec.width*(.2+.6*Math.random()),y:ec.height*.85,v:.3+Math.random()*.5,l:1});E=E.filter(e=>e.l>0);for(const e of E){e.y-=e.v;e.x+=Math.sin(e.y/9)*.3;e.l-=.008;ex.fillStyle=`rgba(255,${150+Math.random()*80|0},60,${e.l})`;ex.fillRect(e.x|0,e.y|0,1,1)}}
const SN=[...document.querySelectorAll('.snow')].map(c=>{const x=c.getContext('2d');const f=[...Array(Math.round(c.width*c.height/500))].map(()=>({x:Math.random()*c.width,y:Math.random()*c.height,v:.15+Math.random()*.35,s:Math.random()<.3?2:1}));return{c,x,f}});
function snow(){for(const s of SN){s.x.clearRect(0,0,s.c.width,s.c.height);s.x.fillStyle='rgba(240,245,255,.9)';for(const p of s.f){p.y+=p.v;p.x+=Math.sin(p.y/15)*.15;if(p.y>s.c.height){p.y=-2;p.x=Math.random()*s.c.width}s.x.fillRect(p.x|0,p.y|0,p.s,p.s)}}}
const gl=document.getElementById('glow');let lt=0;
function loop(t){if(t-lt>33){lt=t;step();emb();snow();gl.style.opacity=.75+Math.random()*.25}if(!RM)requestAnimationFrame(loop)}
